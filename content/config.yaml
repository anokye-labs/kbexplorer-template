title: "kbexplorer"
subtitle: "Interactive Knowledge Base Explorer"

theme:
  # Built-in modes are dark / light / sepia. Press `t` to cycle through every
  # mode below (built-ins first, then these named themes in order).
  default: dark

  # Optional fonts — piped into --kbe-font-* CSS variables (F1 / T1.2).
  font:
    heading: "'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif"
    body: "'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif"
    mono: "'Cascadia Code', 'Cascadia Mono', Consolas, monospace"

  # Named theme variants (F2). Each derives from a `base` (dark/light), takes an
  # optional `brand` seed hex (expanded into a full 16-stop Fluent ramp) and/or
  # explicit `tokens` (which always win). They become selectable in the cycle.
  themes:
    # Calm blue, dark base. Same key is also present in the external file below,
    # which field-merges its token over this one (demonstrates precedence).
    ocean:
      base: dark
      brand: "#1B6CA8"

    # Warm magenta on a light base — good for bright rooms / presentations.
    rose:
      base: light
      brand: "#C2185B"
      tokens:
        colorNeutralBackground1: "#FFF5F8"
        colorNeutralBackground2: "#FCE8EF"

    # High-contrast indigo night theme — deep backgrounds, vivid brand.
    midnight:
      base: dark
      brand: "#5C6BC0"
      tokens:
        colorNeutralBackground1: "#070A12"
        colorNeutralBackground2: "#0E1424"
        colorNeutralForeground1: "#F2F4FF"

  # Load even more named themes from a dedicated host-repo file (F5 / T5.1).
  # Fetched at runtime like this config and merged into the THEME_MAP; the
  # external file wins over the inline `themes` above for same-named keys.
  themesFile: content/themes/extra-themes.yaml

clusters:
  engine:
    name: "Engine"
    color: "#4A9CC8"
  ui:
    name: "Interface"
    color: "#8CB050"
  visual:
    name: "Visual System"
    color: "#E8A838"
  data:
    name: "Data Layer"
    color: "#C07840"
  infra:
    name: "Infrastructure"
    color: "#5A98A8"
  design:
    name: "Design Decisions"
    color: "#A86FDF"
  guide:
    name: "Guide"
    color: "#39FF14"
  reference:
    name: "Reference"
    color: "#79C0FF"
  # Team operations — folds the content-model spine (org / team / squad /
  # person / mission / priority / workstream / cycle / system-of-record)
  # into one legend entry. Without this, each kind becomes a 1-5 node
  # singleton cluster and the legend overflows into "+N more" — exactly
  # the fragmentation the sensemaking audit was added to catch.
  teamops:
    name: "Team Ops"
    color: "#F0883E"
  # Work-axis clusters — declared here so their legend entries have stable
  # colours (they used to be palette-allocated on the fly, which shuffled
  # whenever node creation order changed). All issues now land in `work`
  # regardless of their GitHub labels, so the legend stays bounded.
  work:
    name: "Work"
    color: "#F9A8D4"
  pull-request:
    name: "Pull Request"
    color: "#A371F7"
  commits:
    name: "Commits"
    color: "#7EE787"
  releases:
    name: "Releases"
    color: "#3FB950"
  person:
    name: "Person"
    color: "#F0883E"
  code:
    name: "Code"
    color: "#9A8A78"
  docs:
    name: "Docs"
    color: "#E3B341"

providers:
  - type: wikipedia
    name: Concepts
    cluster: reference
    options:
      articles:
        # Graph theory & visualization
        - title: Knowledge graph
          connections: [graph-engine, type-system]
        - title: Force-directed graph drawing
          connections: [graph-network]
        - title: Graph (abstract data type)
          connections: [graph-engine, type-system]
        - title: Graph theory
          connections: [graph-engine]
        - title: Network science
          connections: [graph-engine, graph-network]
        - title: Small-world network
          connections: [graph-engine]
        - title: Breadth-first search
          id: wiki-bfs
          connections: [graph-network]
        # Web tech & architecture
        - title: Single-page application
          id: wiki-spa
          connections: [app-shell, vite-config]
        - title: React (software)
          id: wiki-react
          connections: [app-shell, hud]
        - title: TypeScript
          id: wiki-typescript
          connections: [type-system, vite-config]
        - title: Fluent Design System
          id: wiki-fluent
          connections: [style-system, theme-system]
        - title: WebGL
          id: wiki-webgl
          connections: [graph-network]
        # Content & knowledge management
        - title: Markdown
          id: wiki-markdown
          connections: [content-pipeline, parser]
        - title: YAML
          id: wiki-yaml
          connections: [wiki-configuration, node-mapping]
        - title: Content management system
          id: wiki-cms
          connections: [content-pipeline, local-loader]
        # Software engineering
        - title: Continuous integration
          id: wiki-ci
          connections: [build-scripts, test-suite]
        - title: Software testing
          id: wiki-testing
          connections: [test-suite]
        - title: Digital twin
          id: wiki-digital-twin
          connections: [github-api, cache-system]
