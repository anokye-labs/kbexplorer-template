name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read
  pages: write
  id-token: write

# Scope concurrency per-ref so PR `test` runs don't cancel each other (a single
# global `pages` group with cancel-in-progress:true killed sibling/main runs
# mid-flight). PR runs supersede older runs of the SAME PR (saves CI minutes);
# different refs never cancel one another. Pushes to main (the only ref that
# deploys) use a distinct group with cancel-in-progress:false, so Pages deploys
# serialize and are never cancelled mid-deployment — preserving the deploy contract.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Tier 1: Unit tests
      - name: Run unit tests
        run: npm test

      # Tier 2: Graph validation
      - name: Generate manifest
        run: node scripts/generate-manifest.js
        env:
          VITE_KB_LOCAL: 'true'
          GH_TOKEN: ${{ github.token }}

      - name: Validate graph
        run: npm run validate

      - name: Check manifest drift (idempotency)
        run: npm run validate:drift

      - name: Assess graph quality
        run: node scripts/assess-graph.js --gate

      # Build for E2E
      - name: Build
        run: npx vite build
        env:
          VITE_KB_LOCAL: 'true'
          GH_TOKEN: ${{ github.token }}

      # Tier 3: E2E tests
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test --project=chromium
        env:
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  build:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Generate manifest
        run: node scripts/generate-manifest.js
        env:
          VITE_KB_LOCAL: 'true'
          GH_TOKEN: ${{ github.token }}

      - name: Build
        run: npx vite build
        env:
          VITE_KB_LOCAL: 'true'
          VITE_BASE_PATH: /kbexplorer-template/
          GH_TOKEN: ${{ github.token }}

      - name: Copy index.html to 404.html for SPA routing
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
