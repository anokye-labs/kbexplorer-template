name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read
  pages: write
  id-token: write

# Scope concurrency per-ref so PR `test` runs don't cancel each other (a single
# global `pages` group with cancel-in-progress:true killed sibling/main runs
# mid-flight). PR runs supersede older runs of the SAME PR (saves CI minutes);
# different refs never cancel one another. Pushes to main (the only ref that
# deploys) use a distinct group with cancel-in-progress:false, so Pages deploys
# serialize and are never cancelled mid-deployment — preserving the deploy contract.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Generate manifest BEFORE typecheck: src/engine/local-loader.ts statically
      # imports the generated src/generated/repo-manifest.json, which is gitignored
      # and absent on a clean checkout. `npm run build`'s `tsc -b` only "worked"
      # locally because npm's implicit `prebuild` hook (also `kbx manifest`)
      # ran first; this workflow invokes `tsc -b` directly, which has no such hook,
      # so a fresh checkout failed `tsc -b` with TS2307 even though #448/#449
      # both looked green with a stale local artifact on disk. `--augment` runs
      # the hybrid mode: a deterministic local FS build (config/theme/content)
      # augmented with live GitHub API data (authenticated via GH_TOKEN) for
      # repoMetadata + work data — required for the repo-meta and structural
      # (.github discovery) nodes the E2E suite asserts.
      - name: Generate manifest
        run: npx kbx manifest --augment anokye-labs/kbexplorer-template
        env:
          VITE_KB_LOCAL: 'true'
          GH_TOKEN: ${{ github.token }}

      # Typecheck: catches breakage `vitest`/`vite build` can miss (#448 shipped
      # in v0.4.0 because tsc -b was never run in this workflow — see #449).
      - name: Typecheck
        run: npx tsc -b

      # Tier 1: Unit tests
      - name: Run unit tests
        run: npm test

      # Tier 2: Graph validation
      - name: Validate graph
        run: npm run validate

      - name: Check manifest drift (idempotency)
        run: npm run validate:drift

      - name: Assess graph quality
        run: npx kbx graph assess --gate

      # Build for E2E
      - name: Build
        run: npx vite build
        env:
          VITE_KB_LOCAL: 'true'
          VITE_KB_SKIP_REGEN: '1'
          GH_TOKEN: ${{ github.token }}

      # Tier 3: E2E tests
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test --project=chromium
        env:
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  build:
    needs: test
    # Deploy on a push to main (human merges) OR an explicit dispatch. The
    # auto-merge workflow dispatches this after a bot merge, because pushes made
    # by GITHUB_TOKEN don't trigger the `push` event (anti-recursion). #377
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Generate manifest
        run: npx kbx manifest --augment anokye-labs/kbexplorer-template
        env:
          VITE_KB_LOCAL: 'true'
          GH_TOKEN: ${{ github.token }}

      - name: Build
        run: npx vite build
        env:
          VITE_KB_LOCAL: 'true'
          VITE_KB_SKIP_REGEN: '1'
          VITE_BASE_PATH: /kbexplorer-template/
          GH_TOKEN: ${{ github.token }}

      - name: Copy index.html to 404.html for SPA routing
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
